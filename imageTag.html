<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Tag</title>
  </head>
  <body>
    <img
      src="https://images.pexels.com/photos/36365214/pexels-photo-36365214.jpeg"
      alt="Stone house in green field"
      width="400"
    /><br /><br />
    <picture>
      <img src="./image.png" alt="Local image" height="400" />
    </picture>
    <br />
    <!-- image se map generator -->
    <p> 
        <h3>Image se map generator </h3>
      Iska use social Media tagging ke kaam aata hai jab kisi ko tag karte
      hai.Jab ham img par click karenge to yek pop aa jayega aur alert dikhega
      ga jo bhi alert me likhege hoge.Aur cursor ka shape bhi change ho jayega.
    </p>

    <!-- Image Map Generated by http://www.image-map.net/ -->

    <img src="./R.png" usemap="#image-map" />

    <map name="image-map">
      <area
        onclick="one()"
        target=""
        alt=""
        title=""
        href=""
        coords="305,272,603,480"
        shape="rect"
      />
      <area
        onclick="Two()"
        target=""
        alt=""
        title=""
        href=""
        coords="721,482,959,323"
        shape="rect"
      />
    </map>
    <script>
      function one() {
        alert("Click one Time");
      }
      function Two() {
        alert("Click Two Time");
      }
    </script>
  </body>
</html>
