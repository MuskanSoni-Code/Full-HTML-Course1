<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Tag</title>
  </head>
  <body>
    <!-- Image Tag -->
    <img height="200"
      src="https://img.freepik.com/premium-photo/profile-focused-skilled-girl-web-developer-sitting-her-workstation-her-workplace_76964-382774.jpg?w=1060"
    />

    <!-- Image Tag  Gif Dikhane ke liye -->
    <img
     width="300"
     height="270"
     src="https://miro.medium.com/max/1400/1*qdAW1TjCN57h1lbuuzvchg.gif"
     alt="GIF"
    />

    <!-- Video Tag -->
     <video width="300" height="270" autoplay>
        <source src="https://miro.medium.com/max/1400/1*qdAW1TjCN57h1lbuuzvchg.gif" type="mp4"></video>
     </video>

     <!-- Video Tag All attribute ke sath-->
     <video width="300" height="270" controls autoplay muted>
    <source src="video.mp4" type="video/mp4">
    Your browser does not support the video tag.
    </video>
  </body>
</html>
